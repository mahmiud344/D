<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مجموعات الدروس</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      direction: rtl;
      margin-right: 250px; /* Make space for sidebar */
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .notes-container {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 300px;
      z-index: 100;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 15px;
      direction: rtl;
    }

    .notes-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      resize: vertical;
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    .notes-status {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
      text-align: left;
    }

    .minimize-button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
      color: #555;
    }

    /* File management styles */
    .file-manager {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 350px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 15px;
      direction: rtl;
      z-index: 100;
      max-height: 400px;
      overflow-y: auto;
    }

    .file-manager-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-upload-section {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 10px;
    }

    .file-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-label {
      display: block;
      padding: 10px;
      background: #007bff;
      color: white;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
      border: 2px dashed #007bff;
      transition: all 0.3s ease;
    }

    .file-input-label:hover {
      background: #0056b3;
      border-color: #0056b3;
    }

    .file-input-label.drag-over {
      background: #0056b3;
      border-color: #0056b3;
      transform: scale(1.02);
    }

    .upload-button {
      width: 100%;
      padding: 8px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .upload-button:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .upload-status {
      font-size: 12px;
      margin-top: 5px;
      text-align: center;
    }

    .file-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 5px;
      background: #f8f9fa;
    }

    .file-name {
      flex: 1;
      margin-right: 10px;
      word-break: break-all;
      font-size: 14px;
    }

    .file-actions {
      display: flex;
      gap: 5px;
    }

    .download-button {
      padding: 4px 8px;
      background: #17a2b8;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-file-button {
      padding: 4px 8px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .file-size {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: #007bff;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Sidebar styles */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 250px;
      height: 100vh;
      background: #2c3e50;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      z-index: 1000;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      color: #ecf0f1;
      border-bottom: 1px solid #34495e;
      padding-bottom: 10px;
    }

    .page-form {
      margin-bottom: 20px;
      padding: 15px;
      background: #34495e;
      border-radius: 8px;
    }

    .page-form input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #7f8c8d;
      border-radius: 5px;
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    .page-form button {
      width: 100%;
      padding: 8px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .page-form button:hover {
      background: #2980b9;
    }

    .pages-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .page-item {
      background: #34495e;
      margin-bottom: 8px;
      border-radius: 5px;
      overflow: hidden;
    }

    .page-link {
      display: block;
      padding: 12px;
      color: #ecf0f1;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .page-link:hover {
      background: #3498db;
    }

    .page-link:visited {
      color: #ecf0f1;
    }

    .page-actions {
      padding: 8px 12px;
      background: #2c3e50;
      border-top: 1px solid #7f8c8d;
    }

    .delete-page-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-page-btn:hover {
      background: #c0392b;
    }

    .sidebar-toggle {
      position: fixed;
      top: 20px;
      right: 260px;
      background: #2c3e50;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .group-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .group-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 300px;
      padding: 20px;
      cursor: pointer;
      position: relative;
    }

    .group-card:hover {
      background: #f9f9f9;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .group-name {
      font-weight: bold;
      font-size: 18px;
    }

    .group-actions button {
      margin-left: 5px;
      background: #dc3545;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .lesson-form {
      margin-top: 10px;
    }

    .lesson-form input {
      width: 45%;
      margin-bottom: 5px;
      padding: 5px;
    }

    .lesson-form button {
      width: 100%;
      padding: 6px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
    }

    th {
      background-color: #333;
      color: white;
    }

    .add-group {
      margin-bottom: 20px;
      text-align: center;
    }

    .add-group input {
      padding: 6px;
      width: 200px;
      margin-right: 10px;
    }

    .add-group button {
      padding: 6px 10px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body {
        margin-right: 0;
        padding: 10px;
      }

      .sidebar {
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar-toggle {
        right: 20px;
        display: block;
      }

      .notes-container {
        position: relative;
        top: 0 !important;
        left: 0;
        width: calc(100% - 30px);
        margin-bottom: 20px;
        margin-left: auto;
        margin-right: auto;
      }
      
      #notes2Container {
        margin-top: 20px;
      }

      .file-manager {
        position: relative;
        bottom: 0;
        left: 0;
        width: calc(100% - 30px);
        margin: 20px auto;
      }
    }

    @media (min-width: 769px) {
      .sidebar-toggle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">صفحاتي المحفوظة</div>
    
    <div class="page-form">
      <input type="text" id="pageName" placeholder="اسم الصفحة">
      <input type="url" id="pageUrl" placeholder="رابط الصفحة">
      <button onclick="addPage()">إضافة صفحة</button>
    </div>
    
    <div class="pages-list" id="pagesList">
      <!-- Pages will be loaded here -->
    </div>
  </div>

  <!-- Sidebar Toggle Button for Mobile -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

  <div class="notes-container" id="notesContainer">
    <div class="notes-title">
      <span>الملاحظات 1</span>
      <button class="minimize-button" id="minimizeNotes">-</button>
    </div>
    <textarea class="notes-textarea" id="notesTextarea" placeholder="اكتب ملاحظاتك هنا..."></textarea>
    <div class="notes-status" id="notesStatus">تم الحفظ</div>
  </div>
  
  <div class="notes-container" id="notes2Container" style="top: 250px;">
    <div class="notes-title">
      <span>الملاحظات 2</span>
      <button class="minimize-button" id="minimizeNotes2">-</button>
    </div>
    <textarea class="notes-textarea" id="notes2Textarea" placeholder="اكتب ملاحظاتك الإضافية هنا..."></textarea>
    <div class="notes-status" id="notes2Status">تم الحفظ</div>
  </div>

  <!-- File Manager Section -->
  <div class="file-manager" id="fileManager">
    <div class="file-manager-title">
      <span>إدارة الملفات</span>
      <button class="minimize-button" id="minimizeFiles">-</button>
    </div>
    
    <div class="file-upload-section" id="fileUploadSection">
      <div class="file-input-wrapper">
        <input type="file" class="file-input" id="fileInput" multiple>
        <label for="fileInput" class="file-input-label" id="fileInputLabel">
          اختر الملفات أو اسحبها هنا
        </label>
      </div>
      <button class="upload-button" id="uploadButton" disabled>رفع الملفات</button>
      <div class="upload-status" id="uploadStatus"></div>
      <div class="progress-bar" id="progressBar" style="display: none;">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="file-list" id="fileList">
      <!-- Uploaded files will be displayed here -->
    </div>
  </div>

  <h1>مجموعات الدروس</h1>

  <div class="add-group">
    <input type="text" id="newGroupName" placeholder="اسم المجموعة">
    <button onclick="addGroup()">إضافة مجموعة</button>
  </div>

  <div class="group-container" id="groupsContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL, deleteObject, listAll } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-storage.js";

    // Updated Firebase config with correct credentials
    const firebaseConfig = {
      apiKey: "AIzaSyCzfShOqIBF-VUPd7SpQgbDurQlM2TML5I",
      authDomain: "majsa-b6109.firebaseapp.com",
      databaseURL: "https://majsa-b6109-default-rtdb.firebaseio.com",
      projectId: "majsa-b6109",
      storageBucket: "majsa-b6109.appspot.com",
      messagingSenderId: "694850481469",
      appId: "1:694850481469:web:9d6d699af76c0f18db2954"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const groupsRef = ref(db, "groups");
    const notesRef = ref(db, "notes");
    const filesRef = ref(db, "files");
    const pagesRef = ref(db, "pages");

    const container = document.getElementById("groupsContainer");
    const notesTextarea = document.getElementById("notesTextarea");
    const notesStatus = document.getElementById("notesStatus");
    const notesContainer = document.getElementById("notesContainer");
    const minimizeButton = document.getElementById("minimizeNotes");

    // Notes functionality
    const notes2Textarea = document.getElementById("notes2Textarea");
    const notes2Status = document.getElementById("notes2Status");
    const notes2Container = document.getElementById("notes2Container");
    const minimizeButton2 = document.getElementById("minimizeNotes2");
    
    // File management elements
    const fileInput = document.getElementById("fileInput");
    const fileInputLabel = document.getElementById("fileInputLabel");
    const uploadButton = document.getElementById("uploadButton");
    const uploadStatus = document.getElementById("uploadStatus");
    const fileList = document.getElementById("fileList");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const fileManager = document.getElementById("fileManager");
    const minimizeFilesButton = document.getElementById("minimizeFiles");
    const fileUploadSection = document.getElementById("fileUploadSection");
    
    // Sidebar elements
    const sidebar = document.getElementById("sidebar");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const pagesList = document.getElementById("pagesList");
    const pageNameInput = document.getElementById("pageName");
    const pageUrlInput = document.getElementById("pageUrl");
    
    let saveTimeout, saveTimeout2;
    let notesContent = "";
    let notes2Content = "";
    let isNotesMinimized = false;
    let isNotes2Minimized = false;
    let isFilesMinimized = false;
    let selectedFiles = [];
    
    const notes2Ref = ref(db, "notes2");

    // Load notes from Firebase
    function loadNotes() {
      // Load first notes
      onValue(notesRef, (snapshot) => {
        if (snapshot.exists()) {
          notesContent = snapshot.val().content || "";
          notesTextarea.value = notesContent;
        }
      });
      
      // Load second notes
      onValue(notes2Ref, (snapshot) => {
        if (snapshot.exists()) {
          notes2Content = snapshot.val().content || "";
          notes2Textarea.value = notes2Content;
        }
      });
    }

    // Save notes to Firebase with debounce
    function saveNotes() {
      notesStatus.textContent = "جاري الحفظ...";
      
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        const content = notesTextarea.value;
        set(notesRef, { content: content }).then(() => {
          notesStatus.textContent = "تم الحفظ";
          notesContent = content;
        }).catch(error => {
          notesStatus.textContent = "فشل الحفظ: " + error.message;
        });
      }, 1000);
    }
    
    // Save notes2 to Firebase with debounce
    function saveNotes2() {
      notes2Status.textContent = "جاري الحفظ...";
      
      clearTimeout(saveTimeout2);
      saveTimeout2 = setTimeout(() => {
        const content = notes2Textarea.value;
        set(notes2Ref, { content: content }).then(() => {
          notes2Status.textContent = "تم الحفظ";
          notes2Content = content;
        }).catch(error => {
          notes2Status.textContent = "فشل الحفظ: " + error.message;
        });
      }, 1000);
    }

    // Toggle notes minimize/maximize
    function toggleNotes() {
      if (isNotesMinimized) {
        notesTextarea.style.display = "block";
        notesStatus.style.display = "block";
        minimizeButton.textContent = "-";
        isNotesMinimized = false;
      } else {
        notesTextarea.style.display = "none";
        notesStatus.style.display = "none";
        minimizeButton.textContent = "+";
        isNotesMinimized = true;
      }
    }
    
    // Toggle notes2 minimize/maximize
    function toggleNotes2() {
      if (isNotes2Minimized) {
        notes2Textarea.style.display = "block";
        notes2Status.style.display = "block";
        minimizeButton2.textContent = "-";
        isNotes2Minimized = false;
      } else {
        notes2Textarea.style.display = "none";
        notes2Status.style.display = "none";
        minimizeButton2.textContent = "+";
        isNotes2Minimized = true;
      }
    }

    // Toggle file manager minimize/maximize
    function toggleFiles() {
      if (isFilesMinimized) {
        fileUploadSection.style.display = "block";
        fileList.style.display = "block";
        minimizeFilesButton.textContent = "-";
        isFilesMinimized = false;
      } else {
        fileUploadSection.style.display = "none";
        fileList.style.display = "none";
        minimizeFilesButton.textContent = "+";
        isFilesMinimized = true;
      }
    }

    // File management functions
    function handleFileSelect(event) {
      selectedFiles = Array.from(event.target.files);
      updateFileInputLabel();
      uploadButton.disabled = selectedFiles.length === 0;
    }

    function updateFileInputLabel() {
      if (selectedFiles.length === 0) {
        fileInputLabel.textContent = "اختر الملفات أو اسحبها هنا";
      } else if (selectedFiles.length === 1) {
        fileInputLabel.textContent = `تم اختيار ملف: ${selectedFiles[0].name}`;
      } else {
        fileInputLabel.textContent = `تم اختيار ${selectedFiles.length} ملفات`;
      }
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 بايت';
      const k = 1024;
      const sizes = ['بايت', 'كيلوبايت', 'ميجابايت', 'جيجابايت'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) return;

      uploadButton.disabled = true;
      uploadStatus.textContent = "جاري حفظ الملفات...";
      progressBar.style.display = "block";

      let uploadedCount = 0;
      const totalFiles = selectedFiles.length;

      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          const file = selectedFiles[i];
          
          // Simulate progress
          const progress = ((i + 1) / totalFiles) * 100;
          progressFill.style.width = progress + '%';
          
          // Convert file to base64 for local storage
          const fileData = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
          });
          
          // Save file info to Firebase database
          const fileInfo = {
            name: file.name,
            originalName: file.name,
            size: file.size,
            type: file.type,
            fileData: fileData, // Store file as base64
            uploadDate: Date.now(),
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 9)
          };
          
          await push(filesRef, fileInfo);
          uploadedCount++;
          uploadStatus.textContent = `تم حفظ ${uploadedCount} من ${totalFiles} ملفات`;
        }

        uploadStatus.textContent = `تم حفظ ${uploadedCount} ملف بنجاح`;
        uploadStatus.style.color = "green";
        
      } catch (error) {
        console.error('Error saving files:', error);
        uploadStatus.textContent = `خطأ في حفظ الملفات: ${error.message}`;
        uploadStatus.style.color = "red";
      }

      uploadButton.disabled = false;
      selectedFiles = [];
      fileInput.value = '';
      updateFileInputLabel();
      
      setTimeout(() => {
        progressBar.style.display = "none";
        progressFill.style.width = "0%";
        uploadStatus.style.color = "#666";
        uploadStatus.textContent = "";
      }, 3000);

      loadFiles();
    }

    async function downloadFile(fileData, fileName) {
      try {
        // Create download link from base64 data
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = fileData; // fileData is already base64 URL
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (error) {
        console.error('Error downloading file:', error);
        alert('خطأ في تحميل الملف');
      }
    }

    async function deleteFile(fileId) {
      if (!confirm('هل أنت متأكد من حذف هذا الملف؟')) return;

      try {
        // Delete from database only (no storage to delete from)
        await remove(ref(db, `files/${fileId}`));
        loadFiles();
      } catch (error) {
        console.error('Error deleting file:', error);
        alert('خطأ في حذف الملف');
      }
    }

    function loadFiles() {
      onValue(filesRef, (snapshot) => {
        fileList.innerHTML = "";
        if (snapshot.exists()) {
          snapshot.forEach((fileSnap) => {
            const fileId = fileSnap.key;
            const fileData = fileSnap.val();
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            
            fileItem.innerHTML = `
              <div class="file-info">
                <div class="file-name">${fileData.originalName}</div>
                <div class="file-size">${formatFileSize(fileData.size)}</div>
              </div>
              <div class="file-actions">
                <button class="download-button" onclick="downloadFile('${fileData.fileData}', '${fileData.originalName}')">
                  تحميل
                </button>
                <button class="delete-file-button" onclick="deleteFile('${fileId}')">
                  حذف
                </button>
              </div>
            `;
            
            fileList.appendChild(fileItem);
          });
        } else {
          fileList.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">لا توجد ملفات مرفوعة</div>';
        }
      });
    }

    // Drag and drop functionality
    function setupDragAndDrop() {
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ['dragenter', 'dragover'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, highlight, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, unhighlight, false);
      });

      function highlight(e) {
        fileInputLabel.classList.add('drag-over');
      }

      function unhighlight(e) {
        fileInputLabel.classList.remove('drag-over');
      }

      fileInputLabel.addEventListener('drop', handleDrop, false);

      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        selectedFiles = Array.from(files);
        updateFileInputLabel();
        uploadButton.disabled = selectedFiles.length === 0;
      }
    }

    // Initialize event listeners
    notesTextarea.addEventListener("input", saveNotes);
    minimizeButton.addEventListener("click", toggleNotes);
    
    notes2Textarea.addEventListener("input", saveNotes2);
    minimizeButton2.addEventListener("click", toggleNotes2);

    fileInput.addEventListener('change', handleFileSelect);
    uploadButton.addEventListener('click', uploadFiles);
    minimizeFilesButton.addEventListener('click', toggleFiles);

    // Sidebar functions
    function toggleSidebar() {
      sidebar.classList.toggle('active');
    }

    function addPage() {
      const pageName = pageNameInput.value.trim();
      const pageUrl = pageUrlInput.value.trim();
      
      if (pageName && pageUrl) {
        const pageInfo = {
          name: pageName,
          url: pageUrl,
          dateAdded: Date.now()
        };
        
        push(pagesRef, pageInfo).then(() => {
          pageNameInput.value = '';
          pageUrlInput.value = '';
        }).catch(error => {
          console.error('Error adding page:', error);
          alert('خطأ في إضافة الصفحة');
        });
      } else {
        alert('يرجى ملء اسم الصفحة والرابط');
      }
    }

    function deletePage(pageId) {
      if (confirm('هل أنت متأكد من حذف هذه الصفحة؟')) {
        remove(ref(db, `pages/${pageId}`)).catch(error => {
          console.error('Error deleting page:', error);
          alert('خطأ في حذف الصفحة');
        });
      }
    }

    function openPage(url) {
      window.open(url, '_blank');
    }

    function loadPages() {
      onValue(pagesRef, (snapshot) => {
        pagesList.innerHTML = "";
        if (snapshot.exists()) {
          snapshot.forEach((pageSnap) => {
            const pageId = pageSnap.key;
            const pageData = pageSnap.val();
            
            const pageItem = document.createElement('div');
            pageItem.className = 'page-item';
            
            pageItem.innerHTML = `
              <div class="page-link" onclick="openPage('${pageData.url}')">
                ${pageData.name}
              </div>
              <div class="page-actions">
                <button class="delete-page-btn" onclick="deletePage('${pageId}')">
                  حذف
                </button>
              </div>
            `;
            
            pagesList.appendChild(pageItem);
          });
        } else {
          pagesList.innerHTML = '<div style="text-align: center; color: #bdc3c7; padding: 20px; font-size: 14px;">لا توجد صفحات محفوظة</div>';
        }
      });
    }

    // Make functions global for onclick handlers
    window.downloadFile = downloadFile;
    window.deleteFile = deleteFile;
    window.addGroup = addGroup;
    window.deleteGroup = deleteGroup;
    window.renameGroup = renameGroup;
    window.addLesson = addLesson;
    window.deleteLesson = deleteLesson;
    window.toggleLesson = toggleLesson;
    window.addPage = addPage;
    window.deletePage = deletePage;
    window.openPage = openPage;
    window.toggleSidebar = toggleSidebar;

    // Load data on page load
    loadNotes();
    loadFiles();
    loadPages();
    setupDragAndDrop();

    // Groups and lessons functionality
    function renderGroups() {
      onValue(groupsRef, (snapshot) => {
        container.innerHTML = "";
        snapshot.forEach(groupSnap => {
          const groupId = groupSnap.key;
          const groupData = groupSnap.val();

          const card = document.createElement("div");
          card.className = "group-card";

          card.innerHTML = `
            <div class="group-header">
              <span class="group-name" contenteditable="true" onblur="renameGroup('${groupId}', this.innerText.trim())">${groupData.name}</span>
              <div class="group-actions">
                <button onclick="deleteGroup('${groupId}')">🗑️</button>
              </div>
            </div>
            <div class="lesson-form">
              <input type="text" id="name-${groupId}" placeholder="اسم الدرس">
              <input type="text" id="link-${groupId}" placeholder="الرابط">
              <button onclick="addLesson('${groupId}')">إضافة درس</button>
            </div>
            <table id="table-${groupId}" style="display: none;">
              <thead>
                <tr><th>تم</th><th>اسم الدرس</th><th>الرابط</th><th>حذف</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          `;

          // Handle group card click to show lessons
          card.addEventListener("click", (e) => {
            if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" || 
                e.target.tagName === "A" || e.target.isContentEditable || 
                e.target.tagName === "CHECKBOX" || e.target.type === "checkbox") {
              return;
            }
            
            const table = card.querySelector("table");
            if (table.style.display === "none") {
              table.style.display = "table";
              localStorage.setItem(`table-${groupId}-open`, "true");
            }
          });
          
          // Check localStorage for previously opened tables
          const table = card.querySelector("table");
          if (localStorage.getItem(`table-${groupId}-open`) === "true") {
            table.style.display = "table";
          }

          container.appendChild(card);

          const lessonsRef = ref(db, `groups/${groupId}/lessons`);
          const tableBody = card.querySelector("tbody");

          onValue(lessonsRef, (lessonsSnap) => {
            tableBody.innerHTML = "";
            lessonsSnap.forEach(lessonSnap => {
              const lessonId = lessonSnap.key;
              const lesson = lessonSnap.val();
              const isCompleted = lesson.completed || false;
              const row = document.createElement("tr");
              row.innerHTML = `
                <td><input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleLesson('${groupId}', '${lessonId}', this.checked)"></td>
                <td style="${isCompleted ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${lesson.name}</td>
                <td><a href="${lesson.link}" target="_blank" style="${isCompleted ? 'opacity: 0.6;' : ''}">رابط</a></td>
                <td><button onclick="deleteLesson('${groupId}', '${lessonId}')" style="background: #dc3545; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer;">🗑️</button></td>
              `;
              tableBody.appendChild(row);
            });
          });
        });
      });
    }

    function addGroup() {
      const groupName = document.getElementById("newGroupName").value.trim();
      if (groupName) {
        push(groupsRef, { name: groupName });
        document.getElementById("newGroupName").value = "";
      }
    }

    function deleteGroup(groupId) {
      if (confirm("هل أنت متأكد من حذف هذه المجموعة؟")) {
        remove(ref(db, `groups/${groupId}`));
        localStorage.removeItem(`table-${groupId}-open`);
      }
    }

    function renameGroup(groupId, newName) {
      if (newName) {
        update(ref(db, `groups/${groupId}`), { name: newName });
      }
    }

    function addLesson(groupId) {
      const name = document.getElementById(`name-${groupId}`).value.trim();
      const link = document.getElementById(`link-${groupId}`).value.trim();
      
      if (name && link) {
        const lessonsRef = ref(db, `groups/${groupId}/lessons`);
        push(lessonsRef, { name, link, completed: false });
        document.getElementById(`name-${groupId}`).value = "";
        document.getElementById(`link-${groupId}`).value = "";
      }
    }

    function deleteLesson(groupId, lessonId) {
      if (confirm("هل أنت متأكد من حذف هذا الدرس؟")) {
        remove(ref(db, `groups/${groupId}/lessons/${lessonId}`));
      }
    }

    function toggleLesson(groupId, lessonId, completed) {
      update(ref(db, `groups/${groupId}/lessons/${lessonId}`), { completed });
    }

    // Initialize groups rendering
    renderGroups();
  </script>
</body>
</html>
